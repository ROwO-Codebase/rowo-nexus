name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-production
  cancel-in-progress: false

env:
  CI: true

jobs:
  release-check:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check

  deploy:
    name: Deploy Nexus
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages

      - name: Build reference RP
        run: pnpm --filter @nexus/reference-rp build
        env:
          VITE_NEXUS_WALLET_URL: https://wallet.rowo.link
          NEXUS_RP_ORIGIN: https://notes.rowo.link
          NEXUS_API_URL: https://nexus.rowo.link

      - name: Build wallet
        run: pnpm --filter @nexus/wallet build
        env:
          VITE_NEXUS_API_URL: https://nexus.rowo.link

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command:
            d1 migrations apply nexus-index --remote --config workers/projector/wrangler.jsonc

      - name: Deploy transparency
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/transparency/wrangler.jsonc

      - name: Deploy registry
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/registry/wrangler.jsonc

      - name: Deploy projector
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/projector/wrangler.jsonc

      - name: Deploy public API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/edge-api/wrangler.jsonc

      - name: Deploy reference RP
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config apps/reference-rp/wrangler.jsonc

      - name: Deploy wallet
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config apps/wallet/wrangler.jsonc

      - name: Production smoke tests
        shell: bash
        run: |
          curl --retry 8 --retry-all-errors --fail --silent \
            https://nexus.rowo.link/.well-known/nexus.json

          curl --retry 8 --retry-all-errors --fail --silent \
            https://nexus.rowo.link/.well-known/jwks.json

          curl --retry 8 --retry-all-errors --fail --silent \
            https://status.rowo.link/.well-known/nexus-transparency-keys.json

          curl --retry 8 --retry-all-errors --fail --silent \
            https://notes.rowo.link/api/notes

          curl --retry 8 --retry-all-errors --fail --silent \
            https://wallet.rowo.link/ > /dev/null
